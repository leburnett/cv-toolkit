name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

# A new push supersedes the one before it, so superseded runs stop
# rather than queueing up behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Report every combination that broke, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows runs the unit tests only (no Chrome needed). It is here
          # to cover the platform-specific paths — notably the date
          # formatting in cv_letter.py, where strftime("%-d") is a Unix
          # extension that raises ValueError on Windows.
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Run the unit tests
        run: python -m pytest -m "not slow"

  endtoend:
    name: End-to-end (markdown -> measured PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      # poppler gives us pdfinfo, which the tests use as an independent
      # second opinion on page counts — the one check that doesn't rely on
      # the toolkit's own PDF parsing.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Ensure Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome not preinstalled on this runner image; installing."
            wget -q -O /tmp/chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Run the full suite
        run: python -m pytest

      # Build the template one more time and keep the PDF. When a layout
      # test fails you can open the actual output from the run page instead
      # of guessing from the logs.
      - name: Render the example CV
        if: always()
        run: |
          python cv_build.py cv_template.md \
            --out "${RUNNER_TEMP}/example_cv.html" --max-pages 1 --pdf --no-log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-cv-pdf
          path: ${{ runner.temp }}/example_cv.pdf
          if-no-files-found: warn
